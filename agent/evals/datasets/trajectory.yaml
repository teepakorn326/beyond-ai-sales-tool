# Trajectory fixtures. Each has a Thai question, a seeded case state (evals/world.py),
# the scripted model turns for the investigate loop, the human decision when the
# graph interrupts, and the expected tool-call sequence.
#
# expected.required entries are "tool" or "tool:status" (status: executed, proposed,
# approved, rejected, error). optional lists tools that are fine but not needed.
# order pairs mean "first call of a before first call of b".
#
# With the scripted model the model-side calls are fixed by the fixture; what the
# suite then measures is the deterministic part of the graph (gather, policy
# lookup, proposal derivation, approval gating) and the scorer. With --live the
# same fixtures measure the real model.

- id: traj-01
  question: "เคส 0413 ทำไมยังยื่นไม่ได้ แล้วต้องทำอะไรบ้าง"
  seed: blocked
  script:
    - tools: [[get_extraction, {doc_id: doc-en}]]
    - text: "The English test expired before the submission date"
    - text: "Case 0413 cannot be lodged because the IELTS has expired (R5)"
  approve: true
  expected:
    required: [get_case, list_documents, run_rules, search_policy, get_extraction, "request_document:approved"]
    order: [[get_case, list_documents], [list_documents, run_rules], [run_rules, search_policy], [get_extraction, request_document]]

