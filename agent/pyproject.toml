[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
# LangGraph only. langchain-core arrives as a transitive dependency of
# langgraph and is not imported anywhere in this package; tests enforce that
# no module under agent/ imports langchain in any form.
dependencies = [
  "langgraph>=1.0,<2",
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "fastapi>=0.115", "httpx>=0.27"]
# The HTTP service and the Postgres stores. boto3 is what the anthropic SDK's
# Bedrock client needs.
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "boto3>=1.35",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
