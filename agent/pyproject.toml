[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
# LangGraph only. langchain-core arrives as a transitive dependency of
# langgraph and is not imported anywhere in this package; tests enforce that
# no module under agent/ imports langchain in any form.
dependencies = [
  "langgraph>=1.0,<2",
  "anthropic>=1.0",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
