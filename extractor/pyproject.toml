[project]
name = "extractor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "boto3>=1.35",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pypdfium2>=4.30",
  "pillow>=11",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "playwright>=1.48"]
# iPhone photos. Native library; optional so a minimal install stays small.
heic = ["pillow-heif>=0.18"]
# Direct OpenAI embeddings, only when EMBEDDING_PROVIDER=openai.
openai = ["openai>=1.50"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["evals"]
