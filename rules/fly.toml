app = "vdc-rules"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8081
  force_https = true
  # The rules engine is only ever called by the extractor over Fly's private
  # network, so it is not published publicly.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Ruleset-Version = "block-v1"

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
