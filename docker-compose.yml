services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 5

  rules:
    build: ./rules
    ports: ["8081:8081"]

  extractor:
    build: ./extractor
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      rules: { condition: service_started }
    ports: ["8000:8000"]

  web:
    build: ./web
    environment:
      EXTRACTOR_URL: http://extractor:8000
    depends_on: [extractor]
    ports: ["3000:3000"]
